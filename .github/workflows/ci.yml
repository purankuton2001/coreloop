name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the floor declared in engines; 22 is what most consumers run.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - if: matrix.node != 20
        run: npm test
      # Node 20 cannot strip TypeScript. Compile and execute the same full suite.
      - if: matrix.node == 20
        run: |
          npx tsc -p tsconfig.json --noEmit false --outDir .test-dist --declaration false --declarationMap false --sourceMap false
          node --test .test-dist/test/*.test.js
      - run: npm run build

  peer-ranges:
    # The peer ranges are a promise to consumers; the lockfile only proves the
    # newest of each works. Install the oldest supported majors and typecheck.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save zod@^3.23.0 ai@^5
      - run: npm run typecheck

  keeploop:
    # packages/keeploop is its own npm package with its own lockfile. Node 22+
    # only: its tests run TypeScript through --experimental-strip-types.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/keeploop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/keeploop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
