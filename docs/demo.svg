<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 768" width="762" height="768" role="img" aria-label="coreloop demo: the loop running in a terminal">
  <title>coreloop — dig, verbalize, brand, share</title>
  <style>
    .bg { fill: #0d1117; }
    .chrome { fill: #161b22; }
    .edge { fill: none; stroke: #30363d; stroke-width: 1; }
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      fill: #c9d1d9;
      dominant-baseline: middle;
    }
    .title { fill: #8b949e; font-size: 11px; letter-spacing: 0.08em; }
    .head { fill: #f0f6fc; font-weight: 600; letter-spacing: 0.04em; }
    .rule { fill: #3d444d; }
    .section { fill: #bc8cff; letter-spacing: 0.06em; }
    .label { fill: #79c0ff; }
    .value { fill: #c9d1d9; }
    .cont { fill: #8b949e; }
    .l { opacity: 0; animation: appear 13.34s steps(1, end) infinite; }
    @keyframes appear {
      0% { opacity: 0; }
      0.8% { opacity: 1; }
      97.0% { opacity: 1; }
      98.5% { opacity: 0; }
      100% { opacity: 0; }
    }
    .cursor { fill: #d2a8ff; animation: blink 1.06s steps(1, end) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .l { opacity: 1; animation: none; }
      .cursor { animation: none; }
    }
  </style>

  <rect class="bg" width="762" height="768" rx="10" />
  <rect class="chrome" width="762" height="30" rx="10" />
  <rect class="chrome" y="20" width="762" height="10" />
  <rect class="edge" x="0.5" y="0.5" width="761" height="767" rx="10" />
  <circle cx="18" cy="15" r="4.5" fill="#ff5f57" />
  <circle cx="34" cy="15" r="4.5" fill="#febc2e" />
  <circle cx="50" cy="15" r="4.5" fill="#28c840" />
  <text class="title" x="70" y="15">node examples/demo.mjs</text>

  <text class="l" style="animation-delay:0.00s" x="22" y="46" xml:space="preserve"><tspan class="head">  coreloop  ·  dig → verbalize → brand → share → loop</tspan></text>
  <text class="l" style="animation-delay:0.26s" x="22" y="64" xml:space="preserve"><tspan class="cont"></tspan></text>
  <text class="l" style="animation-delay:0.52s" x="22" y="82" xml:space="preserve"><tspan class="rule">  ── </tspan><tspan class="section">dig</tspan><tspan class="rule"> ───────────────────────────────────────────</tspan></text>
  <text class="l" style="animation-delay:0.78s" x="22" y="100" xml:space="preserve"><tspan>  </tspan><tspan class="label">chart</tspan><tspan>      </tspan><tspan class="value">5 points · biggest move -6 at 12 (trough)</tspan></text>
  <text class="l" style="animation-delay:1.04s" x="22" y="118" xml:space="preserve"><tspan>  </tspan><tspan class="label">ask</tspan><tspan>        </tspan><tspan class="value">"The line moves a long way at 12. What happened, and what were you thinking at</tspan></text>
  <text class="l" style="animation-delay:1.30s" x="22" y="136" xml:space="preserve"><tspan class="cont">             the time?"</tspan></text>
  <text class="l" style="animation-delay:1.56s" x="22" y="154" xml:space="preserve"><tspan>  </tspan><tspan class="label">answer</tspan><tspan>     </tspan><tspan class="value">"everyone laughed. i said nothing back."</tspan></text>
  <text class="l" style="animation-delay:1.82s" x="22" y="172" xml:space="preserve"><tspan>  </tspan><tspan class="label">next</tspan><tspan>       </tspan><tspan class="value">"What did you want to say back?"</tspan></text>
  <text class="l" style="animation-delay:2.08s" x="22" y="190" xml:space="preserve"><tspan class="cont">             why: They went quiet at the exact point that still moves the line.</tspan></text>
  <text class="l" style="animation-delay:2.34s" x="22" y="208" xml:space="preserve"><tspan>  </tspan><tspan class="label">answer</tspan><tspan>     </tspan><tspan class="value">"that i'd still be doing this when they quit."</tspan></text>
  <text class="l" style="animation-delay:2.60s" x="22" y="226" xml:space="preserve"><tspan class="cont"></tspan></text>
  <text class="l" style="animation-delay:2.86s" x="22" y="244" xml:space="preserve"><tspan class="rule">  ── </tspan><tspan class="section">verbalize</tspan><tspan class="rule"> ─────────────────────────────────────</tspan></text>
  <text class="l" style="animation-delay:3.12s" x="22" y="262" xml:space="preserve"><tspan>  </tspan><tspan class="label">candidates</tspan><tspan> </tspan><tspan class="value">1. I keep going after the room stops watching.</tspan></text>
  <text class="l" style="animation-delay:3.38s" x="22" y="280" xml:space="preserve"><tspan class="cont">             2. I turn being underestimated into fuel.</tspan></text>
  <text class="l" style="animation-delay:3.64s" x="22" y="298" xml:space="preserve"><tspan class="cont">             3. I finish what I start, quietly.</tspan></text>
  <text class="l" style="animation-delay:3.90s" x="22" y="316" xml:space="preserve"><tspan>  </tspan><tspan class="label">rejected</tspan><tspan>   </tspan><tspan class="value">"none of these — too polished"</tspan></text>
  <text class="l" style="animation-delay:4.16s" x="22" y="334" xml:space="preserve"><tspan>  </tspan><tspan class="label">refined</tspan><tspan>    </tspan><tspan class="value">1. I never said it back. I just kept showing up.</tspan></text>
  <text class="l" style="animation-delay:4.42s" x="22" y="352" xml:space="preserve"><tspan class="cont">             2. Silence, then twelve years of turning up.</tspan></text>
  <text class="l" style="animation-delay:4.68s" x="22" y="370" xml:space="preserve"><tspan class="cont">             3. I answered them with attendance.</tspan></text>
  <text class="l" style="animation-delay:4.94s" x="22" y="388" xml:space="preserve"><tspan>  </tspan><tspan class="label">accepted</tspan><tspan>   </tspan><tspan class="value">"I never said it back. I just kept showing up."</tspan></text>
  <text class="l" style="animation-delay:5.20s" x="22" y="406" xml:space="preserve"><tspan class="cont"></tspan></text>
  <text class="l" style="animation-delay:5.46s" x="22" y="424" xml:space="preserve"><tspan class="rule">  ── </tspan><tspan class="section">brand</tspan><tspan class="rule"> ─────────────────────────────────────────</tspan></text>
  <text class="l" style="animation-delay:5.72s" x="22" y="442" xml:space="preserve"><tspan>  </tspan><tspan class="label">scored</tspan><tspan>     </tspan><tspan class="value">specificity 4/5 · ownership 5/5</tspan></text>
  <text class="l" style="animation-delay:5.98s" x="22" y="460" xml:space="preserve"><tspan class="cont">             1 axis unscored — dropped, never filled with a neutral 3</tspan></text>
  <text class="l" style="animation-delay:6.24s" x="22" y="478" xml:space="preserve"><tspan>  </tspan><tspan class="label">handle</tspan><tspan>     </tspan><tspan class="value">"Koi To" → invalid-characters</tspan></text>
  <text class="l" style="animation-delay:6.50s" x="22" y="496" xml:space="preserve"><tspan class="cont"></tspan></text>
  <text class="l" style="animation-delay:6.76s" x="22" y="514" xml:space="preserve"><tspan class="rule">  ── </tspan><tspan class="section">share</tspan><tspan class="rule"> ─────────────────────────────────────────</tspan></text>
  <text class="l" style="animation-delay:7.02s" x="22" y="532" xml:space="preserve"><tspan>  </tspan><tspan class="label">moment</tspan><tspan>     </tspan><tspan class="value">improved: specificity +2 → offer the card</tspan></text>
  <text class="l" style="animation-delay:7.28s" x="22" y="550" xml:space="preserve"><tspan class="cont">             no improvement, no offer. asking every time is how a prompt gets ignored</tspan></text>
  <text class="l" style="animation-delay:7.54s" x="22" y="568" xml:space="preserve"><tspan>  </tspan><tspan class="label">suno</tspan><tspan>       </tspan><tspan class="value">"indie folk, 92 BPM, close-mic male vocal, brushed drums, tape hiss, restrained</tspan></text>
  <text class="l" style="animation-delay:7.80s" x="22" y="586" xml:space="preserve"><tspan class="cont">             until the last chorus, quietly defiant"</tspan></text>
  <text class="l" style="animation-delay:8.06s" x="22" y="604" xml:space="preserve"><tspan class="cont">             117 chars, inside Suno's 200 — overflow drops whole fragments</tspan></text>
  <text class="l" style="animation-delay:8.32s" x="22" y="622" xml:space="preserve"><tspan class="cont"></tspan></text>
  <text class="l" style="animation-delay:8.58s" x="22" y="640" xml:space="preserve"><tspan class="rule">  ── </tspan><tspan class="section">when it fails</tspan><tspan class="rule"> ─────────────────────────────────</tspan></text>
  <text class="l" style="animation-delay:8.84s" x="22" y="658" xml:space="preserve"><tspan>  </tspan><tspan class="label">thrown</tspan><tspan>     </tspan><tspan class="value">CoreloopError · empty-input  retryable: false → no retry button, it fails the</tspan></text>
  <text class="l" style="animation-delay:9.10s" x="22" y="676" xml:space="preserve"><tspan class="cont">             same way every time</tspan></text>
  <text class="l" style="animation-delay:9.36s" x="22" y="694" xml:space="preserve"><tspan class="cont">             CoreloopError · api-error    retryable: true  → show the retry button</tspan></text>
  <text class="l" style="animation-delay:9.62s" x="22" y="712" xml:space="preserve"><tspan class="cont"></tspan></text>
  <text class="l" style="animation-delay:9.88s" x="22" y="730" xml:space="preserve"><tspan class="head">  no prompts of its own. bring your own questions.</tspan></text>

  <rect class="cursor" x="22" y="738" width="7" height="14" />
</svg>
